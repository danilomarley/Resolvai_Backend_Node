name: resolvai-password-security
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: isolated-test-only, POSTGRES_DB: resolvai_security_test }
    ports: ['127.0.0.1:55433:5432']
    tmpfs: ['/var/lib/postgresql/data']
    volumes: ['./init.sql:/docker-entrypoint-initdb.d/00-test.sql:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d resolvai_security_test']
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:8026:8025']
  auth:
    image: supabase/gotrue:v2.197.0
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54322/auth/v1
      GOTRUE_SITE_URL: http://127.0.0.1:4174
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:isolated-test-only@db:5432/resolvai_security_test
      DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: isolated-password-security-test-only-secret-2026
      GOTRUE_JWT_ISSUER: http://127.0.0.1:54322/auth/v1
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@e2e.example.test
      GOTRUE_SMTP_SENDER_NAME: ResolvAI Test
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://mail-template/recovery.html
      LOG_LEVEL: error
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://localhost:9999/health']
      interval: 2s
      timeout: 3s
      retries: 30
  mail-template:
    image: nginx:alpine
    volumes: ['./recovery.html:/usr/share/nginx/html/recovery.html:ro']
  gateway:
    image: nginx:alpine
    depends_on: { auth: { condition: service_healthy } }
    ports: ['127.0.0.1:54322:80']
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
