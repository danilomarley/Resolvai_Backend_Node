# Deploy da API no Render (Blueprint). Ver docs/DEPLOY.md.
services:
  - type: web
    name: resolvai-api
    runtime: node
    plan: free
    # Mesma região do banco no Supabase (aws us-west-2).
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Só publica depois que o CI do GitHub (typecheck, testes e build) passar.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_SSL
        value: "true"
      - key: SUPABASE_AUDIENCE
        value: authenticated
      - key: SUPABASE_STORAGE_BUCKET
        value: pedidos
      # Valores secretos ou específicos do ambiente: preencher no painel do Render.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
